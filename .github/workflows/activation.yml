# CI 라이선스 발급용 일회용 워크플로.
# Actions 탭에서 수동 실행(Run workflow) → 아티팩트로 .alf 파일을 받은 뒤:
#   1. https://license.unity3d.com/manual 접속 (동아리 공용 Unity 계정으로 로그인)
#   2. .alf 업로드 → "Unity Personal" 선택 → .ulf 다운로드
#   3. 저장소 Settings > Secrets and variables > Actions 에서
#      UNITY_LICENSE 시크릿에 .ulf 파일의 "전체 내용"(텍스트)을 붙여넣기
#      UNITY_EMAIL / UNITY_PASSWORD 시크릿에 해당 계정 정보 등록
# 발급이 끝나면 이 파일은 지워도 됩니다.
name: Acquire activation file

on: workflow_dispatch

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.0f1

      - name: Expose as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.getManualLicenseFile.outputs.filePath }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
